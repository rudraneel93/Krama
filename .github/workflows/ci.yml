name: ci
on: [push, pull_request]
jobs:
  python-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "clients/python[pandas]" "pytest>=8,<10" "ruff>=0.6,<1"
      - run: ruff check clients scripts
      - run: pytest -q clients/python/tests
  excel-addin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test integrations/excel/test/logic.test.js
      - run: node --check integrations/excel/src/taskpane.js
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
